name: Check deals

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .

      - name: Run deal alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_SCORE: ${{ vars.MIN_SCORE || '8' }}
          VIRAL_THRESHOLD: ${{ vars.VIRAL_THRESHOLD || '7' }}
          DEAL_ALERT_JSON_FEED_URLS: ${{ vars.DEAL_ALERT_JSON_FEED_URLS }}
        run: python -m deal_alert.main

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f state/seen.json ]; then
            git add state/seen.json
            if ! git diff --cached --quiet -- state/seen.json; then
              git commit -m "Update deal alert state"
              git push
            else
              echo "No state changes to commit."
            fi
          else
            echo "No state changes to commit."
          fi
